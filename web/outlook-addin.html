<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todorisu for Outlook</title>
  <!-- Office.js library -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- Supabase -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #1f1f1f;
      --surface: #262626;
      --surface-hover: #303030;
      --border: #383838;
      --text: #f0f0f0;
      --text-muted: #8c8c8c;
      --primary: #dc4c3e;
      --primary-hover: #c53b2f;
      --outlook-blue: #0078d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; font-size: 13px; min-height: 100vh; }
    
    /* Header */
    .addin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .addin-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .addin-badge { background: rgba(0,120,212,0.15); color: #28a8ea; border: 1px solid rgba(0,120,212,0.3); font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .user-pill { font-size: 11px; color: var(--text-muted); }

    /* Environment notice */
    .mode-notice { background: rgba(255, 152, 0, 0.1); border: 1px solid rgba(255, 152, 0, 0.25); border-radius: 6px; padding: 6px 10px; font-size: 11px; color: #ffb74d; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* Email Task Card */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

    .email-preview-box { background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; }
    .email-preview-from { color: #aaa; margin-bottom: 3px; }
    .email-preview-snippet { color: #777; font-size: 11px; max-height: 42px; overflow: hidden; text-overflow: ellipsis; }

    .input-field { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; margin-bottom: 8px; outline: none; }
    .input-field:focus { border-color: var(--primary); }

    .meta-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .select-sm { flex: 1; min-width: 90px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 11px; outline: none; }
    
    .quick-dates { display: flex; gap: 4px; margin-bottom: 10px; }
    .date-btn { flex: 1; padding: 5px 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 4px; color: #ccc; font-size: 10px; cursor: pointer; text-align: center; }
    .date-btn.active { background: rgba(220,76,62,0.2); border-color: var(--primary); color: #ff8c82; font-weight: 600; }

    .btn-add { width: 100%; padding: 9px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-add:hover { background: var(--primary-hover); }
    .btn-add:disabled { opacity: 0.6; cursor: not-allowed; }

    .success-banner { background: rgba(76, 175, 80, 0.15); border: 1px solid rgba(76, 175, 80, 0.3); color: #81c784; padding: 8px 10px; border-radius: 6px; font-size: 12px; margin-top: 8px; text-align: center; display: none; }

    /* Task List Section */
    .task-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: #ccc; }
    .task-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    .task-tab { padding: 4px 8px; background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); font-size: 11px; cursor: pointer; }
    .task-tab.active { background: rgba(255,255,255,0.1); color: var(--text); border-color: #555; }

    .task-list { list-style: none; max-height: 220px; overflow-y: auto; }
    .task-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
    .task-check { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #888; background: none; cursor: pointer; flex-shrink: 0; }
    .task-check.checked { background: #4caf50; border-color: #4caf50; position: relative; }
    .task-check.checked::after { content: "✓"; color: #fff; font-size: 10px; position: absolute; top: -1px; left: 2px; }
    .task-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-due { font-size: 10px; color: #ff8c82; flex-shrink: 0; }

    /* Footer */
    .addin-footer { text-align: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
    .link-open-app { color: #28a8ea; text-decoration: none; font-size: 11px; }
    .link-open-app:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="addin-header">
    <div class="addin-logo">
      <span style="color: var(--primary);">✓</span>
      <span>Todorisu</span>
      <span class="addin-badge">Outlook</span>
    </div>
    <div class="user-pill" id="userEmailLabel">Loading...</div>
  </div>

  <div id="modeNotice" class="mode-notice" style="display: none;">
    <span>Simulation Mode (Browser Preview)</span>
    <span style="font-size: 10px; opacity: 0.8;">Inside Outlook, reads emails automatically</span>
  </div>

  <!-- Add Email to Todorisu Card -->
  <div class="card">
    <div class="card-title">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <span>Active Email</span>
    </div>

    <div class="email-preview-box">
      <div class="email-preview-from" id="emailFromText">From: —</div>
      <div class="email-preview-snippet" id="emailSnippetText">No active email selected</div>
    </div>

    <input type="text" id="taskTitleInput" class="input-field" placeholder="Task name..." />

    <div class="quick-dates">
      <button class="date-btn active" data-val="today">Today</button>
      <button class="date-btn" data-val="tomorrow">Tomorrow</button>
      <button class="date-btn" data-val="nextweek">Next week</button>
      <button class="date-btn" data-val="nodate">No date</button>
    </div>

    <div class="meta-row">
      <select id="taskProjectSelect" class="select-sm">
        <option value="Inbox">Inbox</option>
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
      </select>
      <select id="taskPrioritySelect" class="select-sm">
        <option value="4">P4 (Normal)</option>
        <option value="3">🔵 Priority 3</option>
        <option value="2">🟠 Priority 2</option>
        <option value="1">🔴 Priority 1</option>
      </select>
    </div>

    <button id="addTaskBtn" class="btn-add">
      <span>+ Add to Todorisu</span>
    </button>
    <div id="successBanner" class="success-banner">✓ Task created in Todorisu!</div>
  </div>

  <!-- My Todorisu Tasks in Outlook -->
  <div class="card">
    <div class="task-section-header">
      <span>My Tasks</span>
      <div class="task-tabs">
        <button class="task-tab active" data-tab="today">Today</button>
        <button class="task-tab" data-tab="inbox">Inbox</button>
        <button class="task-tab" data-tab="all">All</button>
      </div>
    </div>
    <ul id="addinTaskList" class="task-list">
      <li style="color:#777; padding: 8px;">Loading tasks...</li>
    </ul>
  </div>

  <div class="addin-footer">
    <a href="index.html" target="_blank" class="link-open-app">Open full Todorisu web app ↗</a>
  </div>

  <script>
    let activeEmailData = {
      subject: "Follow up on project deliverable",
      from: "colleague@company.com",
      body: "Hi Timothy, checking in regarding the updates for our project.",
      link: ""
    };
    let selectedDueDate = "today";
    let currentUser = null;
    let cachedTasks = [];
    let activeFilter = "today";

    // Initialize Supabase
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Initialize Office.js or fallback simulation
    if (typeof Office !== "undefined") {
      Office.onReady((info) => {
        if (info.host === Office.HostType.Outlook && Office.context && Office.context.mailbox) {
          loadOutlookEmailItem();
        } else {
          showSimulationMode();
        }
      });
    } else {
      showSimulationMode();
    }

    function showSimulationMode() {
      document.getElementById("modeNotice").style.display = "flex";
      populateEmailForm(activeEmailData);
    }

    function loadOutlookEmailItem() {
      const item = Office.context.mailbox.item;
      if (!item) return;

      activeEmailData.subject = item.subject || "Email Task";
      activeEmailData.from = item.from ? `${item.from.displayName || item.from.emailAddress}` : "Outlook Sender";
      
      // Deep link to email in Outlook web
      if (item.itemId) {
        activeEmailData.link = `https://outlook.office.com/mail/deeplink/read/${encodeURIComponent(item.itemId)}`;
      }

      // Read email body snippet
      if (item.body && item.body.getAsync) {
        item.body.getAsync(Office.CoercionType.Text, (result) => {
          if (result.status === Office.AsyncResultStatus.Succeeded) {
            activeEmailData.body = (result.value || "").trim().slice(0, 300);
            populateEmailForm(activeEmailData);
          }
        });
      } else {
        populateEmailForm(activeEmailData);
      }
    }

    function populateEmailForm(data) {
      document.getElementById("taskTitleInput").value = data.subject || "";
      document.getElementById("emailFromText").textContent = `From: ${data.from}`;
      document.getElementById("emailSnippetText").textContent = data.body || "No email body text";
    }

    // Due date button toggles
    document.querySelectorAll(".date-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".date-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedDueDate = btn.dataset.val;
      });
    });

    // Calculate due date timestamp
    function getDueAtTimestamp(type) {
      const d = new Date();
      if (type === "today") {
        d.setHours(18, 0, 0, 0);
        return d.toISOString();
      }
      if (type === "tomorrow") {
        d.setDate(d.getDate() + 1);
        d.setHours(18, 0, 0, 0);
        return d.toISOString();
      }
      if (type === "nextweek") {
        const day = d.getDay();
        const diff = (8 - day) % 7 || 7;
        d.setDate(d.getDate() + diff);
        d.setHours(9, 0, 0, 0);
        return d.toISOString();
      }
      return null;
    }

    // Add Task Handler
    document.getElementById("addTaskBtn").addEventListener("click", async () => {
      const title = document.getElementById("taskTitleInput").value.trim();
      if (!title) return;

      const btn = document.getElementById("addTaskBtn");
      btn.disabled = true;
      btn.textContent = "Saving...";

      const project = document.getElementById("taskProjectSelect").value;
      const priority = parseInt(document.getElementById("taskPrioritySelect").value, 10) || 4;
      const due_at = getDueAtTimestamp(selectedDueDate);
      
      const notes = [
        `Email from ${activeEmailData.from}`,
        activeEmailData.link ? `Link: ${activeEmailData.link}` : "",
        activeEmailData.body ? `\n"${activeEmailData.body}"` : ""
      ].filter(Boolean).join("\n");

      const taskPayload = {
        user_id: currentUser ? currentUser.id : "guest",
        title,
        notes,
        project,
        priority,
        due_at,
        has_time: !!due_at,
        completed: false,
        created_at: new Date().toISOString()
      };

      try {
        if (sb) {
          const { data, error } = await sb.from("tasks").insert(taskPayload).select();
          if (data && data[0]) cachedTasks.push(data[0]);
          else cachedTasks.push({ ...taskPayload, id: "task_" + Date.now() });
        } else {
          cachedTasks.push({ ...taskPayload, id: "task_" + Date.now() });
        }

        const banner = document.getElementById("successBanner");
        banner.style.display = "block";
        setTimeout(() => { banner.style.display = "none"; }, 3000);
        renderTasks();
      } catch (err) {
        alert("Failed to save task: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "+ Add to Todorisu";
      }
    });

    // Task tabs
    document.querySelectorAll(".task-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".task-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.tab;
        renderTasks();
      });
    });

    function renderTasks() {
      const list = document.getElementById("addinTaskList");
      list.innerHTML = "";

      let filtered = cachedTasks.filter(t => !t.completed);
      const now = new Date();
      if (activeFilter === "today") {
        filtered = filtered.filter(t => {
          if (!t.due_at) return false;
          const d = new Date(t.due_at);
          return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
        });
      } else if (activeFilter === "inbox") {
        filtered = filtered.filter(t => (t.project || "Inbox").toLowerCase() === "inbox");
      }

      if (filtered.length === 0) {
        list.innerHTML = `<li style="color:#777; padding:8px; text-align:center;">No tasks found.</li>`;
        return;
      }

      filtered.forEach(t => {
        const li = document.createElement("li");
        li.className = "task-item";
        
        const check = document.createElement("button");
        check.className = "task-check" + (t.completed ? " checked" : "");
        check.addEventListener("click", async () => {
          t.completed = !t.completed;
          renderTasks();
          if (sb && t.id && !String(t.id).startsWith("task_")) {
            await sb.from("tasks").update({ completed: t.completed, completed_at: t.completed ? new Date().toISOString() : null }).eq("id", t.id);
          }
        });

        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = t.title;

        li.appendChild(check);
        li.appendChild(title);

        if (t.due_at) {
          const due = document.createElement("span");
          due.className = "task-due";
          const d = new Date(t.due_at);
          due.textContent = d.toLocaleDateString([], { month: "short", day: "numeric" });
          li.appendChild(due);
        }

        list.appendChild(li);
      });
    }

    // Load session & tasks
    (async () => {
      if (!sb) return;
      const { data } = await sb.auth.getSession();
      if (data?.session) {
        currentUser = data.session.user;
        const email = currentUser.email || "Signed in";
        document.getElementById("userEmailLabel").textContent = email.split("@")[0];
      } else {
        document.getElementById("userEmailLabel").textContent = "Guest Mode";
      }

      const { data: taskData } = await sb.from("tasks").select("*").order("created_at", { ascending: false });
      if (taskData) {
        cachedTasks = taskData;
        renderTasks();
      }
    })();
  </script>
</body>
</html>
